const chapters=[];let chapter=null,group=null;
for(const r of rows){if(r.depth===1){chapter={...r,groups:[]};chapters.push(chapter);group=null}else if(r.depth===2&&chapter){group={...r,topics:[]};chapter.groups.push(group)}else if(r.depth===3&&chapter){if(!group){group={title:'기타 항목',num:'',topics:[]};chapter.groups.push(group)}group.topics.push(r)}}
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const list=document.getElementById('list');
function formatExamQuestions(t){const questions=(t.question||'').split(/\n/);const rounds=(t.exam||'').split(/\n/);const scores=(t.score||'').split(/\n/);return `<div class="exam-list">${questions.map((raw,i)=>{const m=raw.match(/^\s*\((\d+)\s*점\s*(\d+)\s*번\)\s*/);const number=m?m[2]:'';const body=m?raw.slice(m[0].length).trim():raw;const points=(scores[i]||(m?m[1]:'')).trim();const round=(rounds[i]||'').trim();const label=[round,number?`${number}번`:'' ].filter(Boolean).join(' · ');return `<div class="exam-question">${label?`<span class="tag">${esc(label)}</span>`:''}<div class="q">${esc(body)}</div>${points?`<span class="score">(${esc(points)}점)</span>`:''}</div>`}).join('')}</div>`}
function render(){list.innerHTML=chapters.map((c,ci)=>`<section class="chapter" data-ch="${ci}"><div class="chapter-head"><button class="chapter-toggle" aria-expanded="false">${esc(c.num)}. ${esc(c.title)}</button><span class="count">${c.groups.reduce((n,g)=>n+g.topics.length,0)}개 항목</span></div><div class="groups hide">${c.groups.map((g,gi)=>`<section class="group" data-group="${ci}-${gi}"><div class="group-head"><button class="group-toggle" aria-expanded="false">${esc(g.num)}　${esc(g.title)}</button><span class="count">${g.topics.length}</span></div><div class="topics hide">${g.topics.map(t=>`<details class="topic" data-search="${esc([t.title,t.num,t.keywords,t.exam,t.question].join(' ').toLowerCase())}"><summary>${t.num?`<span class="num">${esc(t.num)}</span>`:''}<span class="topic-title">${esc(t.title)}</span>${t.exam?'<span class="tag">기출</span>':''}</summary><div class="topic-body">${t.keywords?`<p><strong>학습 키워드</strong><br>${esc(t.keywords)}</p>`:''}${t.exam||t.question?formatExamQuestions(t):''}</div></details>`).join('')}</div></section>`).join('')}</div></section>`).join('');
list.querySelectorAll('.chapter-toggle').forEach(b=>b.onclick=()=>toggle(b,b.closest('.chapter').querySelector('.groups')));
list.querySelectorAll('.group-toggle').forEach(b=>b.onclick=()=>toggle(b,b.closest('.group').querySelector('.topics')));
updateSummary();}
function toggle(btn,el,force){const open=force??el.classList.contains('hide');el.classList.toggle('hide',!open);btn.setAttribute('aria-expanded',String(open))}
function updateSummary(){document.getElementById('summary').textContent=`대분류 ${chapters.length}개 · 세부 항목 ${rows.filter(r=>r.depth===3).length}개`;}
render();
document.getElementById('all').onclick=e=>{const details=[...list.querySelectorAll('.topic')].filter(x=>!x.classList.contains('hide'));const open=e.currentTarget.dataset.open!=='1';list.querySelectorAll('.chapter,.group').forEach(s=>{const b=s.querySelector(':scope > .chapter-head > button,:scope > .group-head > button');const box=s.querySelector(':scope > .groups,:scope > .topics');if(b&&box&&!s.classList.contains('hide'))toggle(b,box,open)});details.forEach(d=>d.open=open);e.currentTarget.dataset.open=open?'1':'0';e.currentTarget.textContent=open?'모두 접기':'모두 펼치기'};
document.getElementById('search').addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase();let hits=0;list.querySelectorAll('.chapter').forEach(ch=>{let chMatch=(ch.querySelector('.chapter-toggle').textContent+' '+ch.textContent).toLowerCase().includes(q);let visible=0;ch.querySelectorAll('.group').forEach(gr=>{let gvisible=0;gr.querySelectorAll('.topic').forEach(t=>{const match=!q||t.dataset.search.includes(q);t.classList.toggle('hide',!match);if(match){gvisible++;visible++}});gr.classList.toggle('hide',!!q&&gvisible===0);if(q&&gvisible){gr.querySelector('.topics').classList.remove('hide');gr.querySelector('.group-toggle').setAttribute('aria-expanded','true')}});ch.classList.toggle('hide',!!q&&visible===0&&!chMatch);if(q&&visible){ch.querySelector('.groups').classList.remove('hide');ch.querySelector('.chapter-toggle').setAttribute('aria-expanded','true')}hits+=visible});document.getElementById('empty').style.display=q&&hits===0?'block':'none';document.getElementById('summary').textContent=q?`${hits}개 항목 검색됨`:`대분류 ${chapters.length}개 · 세부 항목 ${rows.filter(r=>r.depth===3).length}개`});
</script></body></html>
